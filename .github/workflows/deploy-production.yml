name: Deploy production via FTPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lurbrook-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.FTPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      FTPS_HOST: ngvip4.afeeshost.com
      FTPS_PORT: "21"
      FTPS_USERNAME: lurbrook@lurbrookhealthltd.com
      FTPS_PASSWORD: ${{ secrets.FTPS_PASSWORD }}
      FTPS_REMOTE_DIR: ${{ vars.FTPS_REMOTE_DIR }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

    steps:
      - name: Check out release
        uses: actions/checkout@v5

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          invalid=0
          for name in FTPS_USERNAME FTPS_PASSWORD ADMIN_EMAIL ADMIN_PASSWORD FTPS_REMOTE_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing deployment setting::$name is not configured in the repository."
              invalid=1
            fi
          done
          if [ -n "$ADMIN_PASSWORD" ] && [ ${#ADMIN_PASSWORD} -lt 16 ]; then
            echo "::error title=Invalid administrator password::ADMIN_PASSWORD must contain at least 16 characters."
            invalid=1
          fi
          if [ -n "$FTPS_REMOTE_DIR" ] && [[ ! "$FTPS_REMOTE_DIR" =~ ^/[A-Za-z0-9._/-]*$ ]]; then
            echo "::error title=Invalid remote directory::FTPS_REMOTE_DIR contains unsupported characters."
            invalid=1
          fi
          if [[ "$FTPS_REMOTE_DIR" == *".."* ]]; then
            echo "::error title=Invalid remote directory::FTPS_REMOTE_DIR cannot contain two consecutive dots."
            invalid=1
          fi
          exit "$invalid"

      - name: Build production package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _deploy
          git archive HEAD | tar -x -C _deploy
          rm -rf _deploy/.github _deploy/.kilocode _deploy/.qodo _deploy/template
          rm -rf _deploy/1_infraredearthermometer _deploy/automaticbloodpressuremonitor
          rm -rf _deploy/automaticbloodpressuremonitor_main _deploy/medicalinfraredearthermometer
          rm -rf _deploy/noncontactinfraredthermometer _deploy/typeiirmedicalmasks
          rm -rf _deploy/logo _deploy/images
          mkdir -p _deploy/data/sessions _deploy/uploads

          admin_email_b64=$(printf '%s' "$ADMIN_EMAIL" | base64 -w0)
          admin_password_b64=$(printf '%s' "$ADMIN_PASSWORD" | base64 -w0)
          cat > _deploy/data/production-config.php <<PHP
          <?php
          return [
              'site_url' => 'https://www.lurbrookhealthltd.com',
              'admin_email' => base64_decode('$admin_email_b64'),
              'admin_password' => base64_decode('$admin_password_b64'),
          ];
          PHP

      - name: Install FTPS client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Upload release over explicit FTPS
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$HOME/.netrc" /tmp/lurbrook-deploy.lftp' EXIT
          netrc_quote() {
            local value="$1"
            value="${value//\\/\\\\}"
            value="${value//\"/\\\"}"
            printf '"%s"' "$value"
          }
          {
            printf 'machine %s\nlogin ' "$FTPS_HOST"
            netrc_quote "$FTPS_USERNAME"
            printf '\npassword '
            netrc_quote "$FTPS_PASSWORD"
            printf '\n'
          } > "$HOME/.netrc"
          cat > /tmp/lurbrook-deploy.lftp <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          open ftp://$FTPS_HOST:$FTPS_PORT
          mkdir -p "$FTPS_REMOTE_DIR"
          mirror --reverse --verbose=1 --parallel=3 --no-perms _deploy/ "$FTPS_REMOTE_DIR"
          bye
          LFTP
          set +e
          ftps_output=$(lftp -f /tmp/lurbrook-deploy.lftp 2>&1)
          ftps_status=$?
          set -e
          if [ "$ftps_status" -ne 0 ]; then
            printf '%s\n' "$ftps_output"
            diagnostic=$(printf '%s' "$ftps_output" | tail -c 1500)
            diagnostic=${diagnostic//'%'/'%25'}
            diagnostic=${diagnostic//$'\r'/'%0D'}
            diagnostic=${diagnostic//$'\n'/'%0A'}
            echo "::error title=FTPS upload failed::$diagnostic"
            exit "$ftps_status"
          fi

      - name: Verify production website
        shell: bash
        run: |
          curl --fail --show-error --silent --retry 6 --retry-delay 10 --max-time 30 https://www.lurbrookhealthltd.com/ > /dev/null
          echo "Production health check passed."
